<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitSense - AI Fitness Recommendation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>💪 FitSense</h1>
        <p>Personalized Fitness Recommendations Powered by AI</p>
    </header>

    <!-- Main Container -->
    <div class="container">

        <div class="card">

            <h2>🏃 Create Your Fitness Plan</h2>

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Age</label>
            <input type="number" id="age" placeholder="Enter your age">

            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="Example: 165">

            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="Example: 60">

            <label>Fitness Goal</label>
            <select id="goal">
                <option value="">Select your goal</option>
                <option value="weightloss">Weight Loss</option>
                <option value="muscle">Muscle Gain</option>
                <option value="fitness">General Fitness</option>
                <option value="flexibility">Improve Flexibility</option>
            </select>

            <label>Activity Level</label>
            <select id="activity">
                <option value="">Select activity level</option>
                <option value="low">Low</option>
                <option value="medium">Moderate</option>
                <option value="high">High</option>
            </select>

            <button onclick="generatePlan()">Generate My Plan</button>

        </div>

        <!-- Result -->
        <div id="result" class="result">

            <h2>📊 Your Fitness Dashboard</h2>

            <div id="welcome"></div>

            <div class="stats">
                <div>
                    <h3>BMI</h3>
                    <p id="bmi">--</p>
                </div>

                <div>
                    <h3>Water</h3>
                    <p id="water">--</p>
                </div>

                <div>
                    <h3>Workout</h3>
                    <p id="workout">--</p>
                </div>
            </div>

            <div class="recommendation">
                <h3>🤖 AI Recommendation</h3>
                <p id="recommendation"></p>
            </div>

            <div class="recommendation">
                <h3>🥗 Diet Recommendation</h3>
                <p id="diet"></p>
            </div>

            <div class="recommendation">
                <h3>🏋️ Suggested Exercises</h3>
                <p id="exercises"></p>
            </div>

        </div>

    </div>

    <footer>
        <p>FitSense © 2026 | Naan Mudhalvan Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
